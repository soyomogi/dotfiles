# マウス操作を有効にする
setw -g mouse on

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1
set -g renumber-windows on

# ペインのインデックスを1から始める
setw -g pane-base-index 1

# 256色端末を使用する
set -g default-terminal "screen-256color"
set -g terminal-overrides 'xterm:colors=256'

# アクティブなペインを目立たせる
set -g pane-active-border-style fg=white,bg=blue

# ペイン分割時にカレントディレクトリを開く
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# Herdr のタブ操作
bind -N 'New tab' c new-window -c '#{pane_current_path}'
bind -N 'Next tab' n next-window
bind -N 'Previous tab' p previous-window
bind -N 'Rename tab' T command-prompt -I '#W' { rename-window '%%' }
bind -N 'Close tab' X confirm-before -p 'Close tab #W? (y/n)' kill-window

# Herdr のペイン操作
bind -N 'Split right' v split-window -h -c '#{pane_current_path}'
bind -N 'Split down' - split-window -v -c '#{pane_current_path}'
bind -N 'Focus left' h select-pane -L
bind -N 'Focus down' j select-pane -D
bind -N 'Focus up' k select-pane -U
bind -N 'Focus right' l select-pane -R
bind -N 'Swap left' H swap-pane -s '{left-of}'
bind -N 'Swap down' J swap-pane -s '{down-of}'
bind -N 'Swap up' K swap-pane -s '{up-of}'
bind -N 'Swap right' L swap-pane -s '{right-of}'
bind -N 'Next pane' Tab select-pane -t :.+
bind -N 'Previous pane' BTab select-pane -t :.-
bind -N 'Last pane' BSpace last-pane
bind -N 'Rename pane' P command-prompt -I '#T' { select-pane -T '%%' }
bind -N 'Close pane' x confirm-before -p 'Close pane #P? (y/n)' kill-pane
bind -N 'Zoom pane' z resize-pane -Z

# Herdr のワークスペースを tmux のセッションに対応させる
bind -N 'New workspace' N new-session -c '#{pane_current_path}'
bind -N 'Previous workspace' , switch-client -p
bind -N 'Next workspace' . switch-client -n
bind -N 'Rename workspace' W command-prompt -I '#S' { rename-session '%%' }
bind -N 'Close workspace' D confirm-before -p 'Close workspace #S? (y/n)' kill-session
bind -N 'Choose a workspace or tab' g choose-tree -Zw
bind -N 'Choose a workspace' w choose-tree -Zs
bind -N 'Settings' s customize-mode -Z

# Obsidian Terminal の Ctrl+数字は prefix+Alt+数字として届く。
# ステータスバーと同じ名前順でセッションを選ぶ。
set -g @switch-workspace 'slot=$1; shift; if [ "$slot" -le "$#" ]; then shift "$((slot - 1))"; tmux -S #{q:socket_path} switch-client -c #{q:client_name} -t "$1"; fi'
bind -N 'Workspace 1' M-1 run-shell 'set -- 1 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 2' M-2 run-shell 'set -- 2 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 3' M-3 run-shell 'set -- 3 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 4' M-4 run-shell 'set -- 4 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 5' M-5 run-shell 'set -- 5 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 6' M-6 run-shell 'set -- 6 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 7' M-7 run-shell 'set -- 7 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 8' M-8 run-shell 'set -- 8 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'
bind -N 'Workspace 9' M-9 run-shell 'set -- 9 #{S/n:#{q:session_id} }; #{E:@switch-workspace}'

# Files を右に開く。同じウィンドウでは開いたペインに移動し、そこで再度押すと閉じる。
bind -N 'Toggle Files' f if-shell -F '#{@files-pane}' {
    kill-pane
} {
    if-shell -F '#{P:#{?@files-pane,#{pane_id},}}' {
        run-shell -C 'select-pane -t #{P:#{?@files-pane,#{pane_id},}}'
    } {
        if-shell 'command -v nvim >/dev/null 2>&1' {
            if-shell -F '#{>:#{pane_width},81}' {
                split-window -h -l 40 -c '#{pane_current_path}' nvim --clean -M +Explore
                set-option -p @files-pane 1
            } {
                split-window -h -c '#{pane_current_path}' nvim --clean -M +Explore
                set-option -p @files-pane 1
            }
        } {
            display-message 'Files requires Neovim (nvim)'
        }
    }
}

# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ステータスバーの背景色をピンクに設定
set-option -g status-bg pink
set-option -g status-fg blue

# 画面上端の1行目にセッション一覧、2行目にウィンドウ一覧を表示する
set -g status-position top
set -g status 2
set -g status-left ''
# リロードのたびに tmux 標準のウィンドウ行を2行目に移す
set -gu status-format
set -gF 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' '#[align=left] Sessions #[norange default]#[list=on align=left]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S/n:#[range=session|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[list=focus fg=pink bg=blue bold],} #{q/h:session_name} #[norange list=on default]}#[nolist]'


# 選択中のタブは背景色で示し、ズームなどの状態記号は残す
set -g window-status-current-style 'fg=pink,bg=blue,bold'
set -g window-status-current-format ' #I:#W#{s/[*]//:window_flags} '

# 区切り
set-option -g pane-active-border-style bg=pink

# クリップボード統合
set -g set-clipboard on
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
