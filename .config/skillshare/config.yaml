# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  skills: ~/.config/skillshare/skills
  agents: ~/git/skills/agents
  extras: ~/.config/skillshare/extras

preserve_tilde_on_save: true
mode: merge

targets:
  claude:
    skills:
      mode: copy
      path: ~/.claude/skills
      target_naming: standard
  universal:
    skills:
      mode: copy
      path: ~/.agents/skills
      target_naming: standard

extras:
  - name: soyomogi
    file: AGENTS.md
    targets:
      - path: ~/.codex
        mode: prepend
      - path: ~/.agents
        mode: prepend
  - name: trigger
    file: AGENTS.md
    targets:
      - path: ~/.codex
        mode: append
      - path: ~/.agents
        mode: append
  - name: patches-skill-audit
    source: ~/.config/skillshare/extras/patches
    file: skill-audit.md
    targets:
      - path: ~/.claude/skills/skill-audit
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/skill-audit
        mode: append
        as: SKILL.md
  - name: patches-skill-authoring
    source: ~/.config/skillshare/extras/patches
    file: skill-authoring.md
    targets:
      - path: ~/.claude/skills/skill-authoring
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/skill-authoring
        mode: append
        as: SKILL.md
  - name: patches-grilling
    source: ~/.config/skillshare/extras/patches
    file: grilling.md
    targets:
      - path: ~/.claude/skills/grilling
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/grilling
        mode: append
        as: SKILL.md
  - name: patches-pr
    source: ~/.config/skillshare/extras/patches
    file: pr.md
    targets:
      - path: ~/.claude/skills/pr
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/pr
        mode: append
        as: SKILL.md
  - name: patches-to-tickets
    source: ~/.config/skillshare/extras/patches
    file: to-tickets.md
    targets:
      - path: ~/.claude/skills/to-tickets
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/to-tickets
        mode: append
        as: SKILL.md
  - name: patches-obsidian-notes
    source: ~/.config/skillshare/extras/patches
    file: obsidian-notes.md
    targets:
      - path: ~/.claude/skills/obsidian-notes
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/obsidian-notes
        mode: append
        as: SKILL.md
  - name: patches-domain-modeling
    source: ~/.config/skillshare/extras/patches
    file: domain-modeling.md
    targets:
      - path: ~/.claude/skills/domain-modeling
        mode: append
        as: SKILL.md
      - path: ~/.agents/skills/domain-modeling
        mode: append
        as: SKILL.md
  - name: memory
    targets: []

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL

follow_source_links: true
